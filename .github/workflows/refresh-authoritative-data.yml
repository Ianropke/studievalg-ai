name: Refresh authoritative data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 5 * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ingestion dependency
        run: python -m pip install requests
      - name: Fetch authoritative sources
        run: python etl/fetch_authoritative_sources.py
      - name: Validate source contract
        run: python etl/validate_source_contract.py
      - name: Commit refreshed raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources/raw data/sources/raw_source_manifest.json
          if git diff --cached --quiet; then
            echo "No source changes."
          else
            git commit -m "data: refresh authoritative source snapshots"
            git push
          fi
