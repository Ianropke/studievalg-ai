name: Refresh authoritative data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 5 * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ingestion dependency
        run: python -m pip install requests
      - name: Fetch authoritative sources
        run: python etl/fetch_authoritative_sources.py
      - name: Verify manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/sources/raw_source_manifest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('sources'), 'No authoritative source artefacts were fetched'
          for item in data['sources']:
              assert item.get('sha256') and item.get('source_url') and item.get('retrieved_at')
          print(f"Verified {len(data['sources'])} raw source artefacts")
          PY
      - name: Build KOT to UDD crosswalk
        run: python etl/build_education_crosswalk.py
      - name: Run data quality gate
        run: python etl/run_data_quality_gate.py
      - name: Golden programme provenance audit
        run: python etl/audit_golden_programmes.py
      - name: Commit refreshed raw data and validation artefacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources/raw data/sources/raw_source_manifest.json data/sources/kot_udd_crosswalk.csv data/sources/kot_udd_crosswalk_report.json data/sources/data_quality_gate_report.json data/sources/golden_programme_audit.json
          if git diff --cached --quiet; then
            echo "No source changes."
          else
            git commit -m "data: refresh authoritative source snapshots"
            git push
          fi
