name: Refresh authoritative data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 5 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch current official metadata and register snapshots atomically
        run: python etl/fetch_authoritative_sources.py
      - name: Fetch reviewed salary extract and record UFM distribution readiness
        run: python etl/fetch_official_statbank_sources.py --allow-missing-ufm-distribution
      - name: Transform reviewed salary extract at official education-category grain
        run: python etl/transform_lons11_salary.py
      - name: Verify manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/sources/raw_source_manifest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('sources'), 'No authoritative source artefacts were fetched'
          for item in data['sources']:
              assert item.get('sha256') and item.get('source_url') and item.get('retrieved_at')
          assert data.get('scoring_readiness'), 'Manifest must state scoring readiness'
          print(f"Verified {len(data['sources'])} raw source artefacts")
          PY
      - name: Record KOT to UDD readiness without inventing mappings
        run: python etl/run_data_quality_gate.py --allow-blocked
      - name: Record golden programme readiness
        run: python etl/audit_golden_programmes.py --allow-blocked
      - name: Verify pinned O*NET model inputs
        run: python etl/migrate_onet31.py --check
      - name: Build model sensitivity report
        run: python etl/validate_model_stability.py
      - name: Build programme provenance report
        run: python etl/build_data_provenance_report.py
      - name: Build evidence readiness report
        run: python etl/build_evidence_readiness_report.py
      - name: Verify model and discovery metadata
        run: python etl/check_model_discovery_freshness.py
      - name: Upload refresh evidence
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-refresh-evidence
          path: |
            data/sources/raw_source_manifest.json
            data/sources/raw/SOURCE_MANIFEST.json
            data/sources/salary_by_education_manifest.json
            data/sources/kot_udd_crosswalk_report.json
            data/sources/data_quality_gate_report.json
            data/sources/golden_programme_audit.json
            data/DATA_PROVENANCE_REPORT.json
            data/EVIDENCE_READINESS_REPORT.json
            data/MODEL_STABILITY_REPORT.json
          if-no-files-found: error
      - name: Open a reviewable refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources/raw data/sources/raw_source_manifest.json data/sources/education_crosswalk_spec.json data/sources/salary_by_education.csv data/sources/salary_by_education_manifest.json data/sources/kot_udd_crosswalk_report.json data/sources/data_quality_gate_report.json data/sources/golden_programme_audit.json data/EVIDENCE_READINESS_REPORT.json data/MODEL_STABILITY_REPORT.json
          if git diff --cached --quiet; then
            echo "No source changes."
          else
            branch="automation/authoritative-refresh-${GITHUB_RUN_ID}"
            git switch -c "$branch"
            git commit -m "data: refresh authoritative source evidence"
            git push --set-upstream origin "$branch"
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            if gh pr create \
              --base main \
              --head "$branch" \
              --title "data: review authoritative source refresh" \
              --body "Automated monthly refresh of official source metadata, register snapshots, provenance readiness and model sensitivity. BLOCKED statuses are intentional evidence that missing programme mappings or machine distributions were not invented. Review generated reports before merging."; then
              echo "A review pull request was opened." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::The refresh branch was pushed, but repository policy prevented GitHub Actions from opening a pull request."
              echo "## Manual review required" >> "$GITHUB_STEP_SUMMARY"
              echo "The verified refresh is available on branch \`$branch\`, but Actions could not open the pull request." >> "$GITHUB_STEP_SUMMARY"
              echo "[Open a pull request from the refresh branch]($compare_url)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
