name: Strict provenance audit (manual)

# The canonical automatic checks live in quality.yml.
# This workflow remains manually invokable because the current catalogue still
# has documented provenance gaps. It must fail rather than hide those gaps.

on:
  workflow_dispatch:

jobs:
  provenance-audit:
    name: Strict programme provenance audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run strict provenance audit
        run: python etl/validate_data_provenance.py

      - name: Upload strict audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-data-provenance-report
          path: data/DATA_PROVENANCE_REPORT.json
          if-no-files-found: error
