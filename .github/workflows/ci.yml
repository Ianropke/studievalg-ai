name: Legacy provenance audit (manual)

# The canonical automatic checks live in quality.yml.
# This workflow remains available for manually reviewing the stricter
# provenance audit, which currently reports incomplete source mappings.

on:
  workflow_dispatch:

jobs:
  provenance-audit:
    name: Strict programme provenance audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run strict provenance audit
        run: python etl/validate_data_provenance.py
