name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm install --prefix web --no-audit --no-fund

      - name: TypeScript
        run: npm run --prefix web typecheck

      - name: ESLint
        run: npm run --prefix web lint

      - name: Algorithm tests
        run: npm run --prefix web algorithm:test

      - name: Production build
        run: npm run --prefix web build

      - name: Install Chromium for browser tests
        run: npm exec --prefix web -- playwright install --with-deps chromium

      - name: Browser E2E tests
        run: npm run --prefix web e2e

  data:
    name: Python tests and data integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Analytics service syntax
        run: python -m py_compile services/analytics_api.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run data integrity gate
        run: python etl/verify_all_data_integrity.py

      - name: Build provenance audit report
        run: python etl/build_data_provenance_report.py

      - name: Upload provenance audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-provenance-report
          path: data/DATA_PROVENANCE_REPORT.json
          if-no-files-found: error
