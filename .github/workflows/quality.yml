name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm install --prefix web --no-audit --no-fund

      - name: TypeScript
        run: npx --prefix web tsc --noEmit

      - name: ESLint
        run: npm run --prefix web lint

      - name: Algorithm tests
        run: npx --yes --prefix web tsx web/src/__tests__/algorithm.test.ts

      - name: Production build
        run: npm run --prefix web build

  data:
    name: Python tests and data integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run data integrity gate
        run: python etl/verify_all_data_integrity.py
